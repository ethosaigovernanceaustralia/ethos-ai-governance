<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Page Not Found | Ethos AI Governance</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,300;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet"/>
  <style>
    .nf-page { min-height: 100vh; display: flex; flex-direction: column; background: #F8F7F5; }
    .nf-nav { background: #0D1F3C; padding: 0 2rem; height: 64px; display: flex; align-items: center; }
    .nf-nav a { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nf-nav img { width: 32px; height: 32px; }
    .nf-brand { font-family: Inter, sans-serif; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.08em; color: #fff; }
    .nf-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .nf-card { max-width: 560px; text-align: center; }
    .nf-code { font-family: Inter, sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A8833A; margin: 0 0 0.75rem; }
    .nf-card h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 2.25rem; color: #0D1F3C; margin: 0 0 1rem; }
    .nf-card p { font-family: Inter, sans-serif; color: #4b5563; line-height: 1.6; margin: 0 0 2rem; }
    .nf-links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .nf-links a { font-family: Inter, sans-serif; font-weight: 600; font-size: 0.9rem; padding: 0.75rem 1.25rem; border-radius: 8px; text-decoration: none; border: 1px solid #0D1F3C; color: #0D1F3C; }
    .nf-links a.primary { background: #0D1F3C; color: #fff; }
    .nf-links a:focus-visible { outline: 3px solid #A8833A; outline-offset: 2px; }
  </style>
  <script src="/dom-actions.js" defer></script>
</head>
<body>
  <div class="nf-page">
    <nav class="nf-nav" aria-label="Ethos">
      <a href="/"><img src="/assets/logo-icon-white.svg" alt="" width="32" height="32"/><span class="nf-brand">ETHOS</span></a>
    </nav>
    <main class="nf-main">
      <div class="nf-card">
        <p class="nf-code">Error 404</p>
        <h1>We could not find that page</h1>
        <p>The link may be out of date, or the address may have a typo. These pages will get you back on track.</p>
        <div class="nf-links">
          <a class="primary" href="/">Home</a>
          <a href="/services">Services</a>
          <a href="/free-audit">Free Audit</a>
          <a href="/contact">Contact</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
